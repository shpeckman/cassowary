name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        crystal: [1.21.0, latest, nightly]
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v7

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Check formatting
        run: crystal tool format --check src spec bench examples

      - name: Run specs
        run: crystal spec

      - name: Run deep fuzzing
        run: crystal spec spec/fuzz_spec.cr
        env:
          FUZZ_SEEDS: "200"

      - name: Run example
        run: crystal run examples/layout.cr

      - name: Build docs
        run: crystal docs
